# Despliegue en Render.com — "New" → "Blueprint" → este repositorio → Apply.
services:
  # La web que ve el alumno
  - type: web
    name: radar-creativos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    disk:
      name: datos
      mountPath: /data       # solo guarda los tokens CIFRADOS de quien active el 24/7
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: CLAVE_TOKENS    # clave con la que se cifran los tokens en reposo
        generateValue: true  # Render la genera sola; no la ve nadie

  # 🌙 EL AGENTE 24/7: se ejecuta solo cada madrugada
  - type: cron
    name: agente-nocturno
    runtime: python
    plan: starter
    schedule: "17 3 * * *"   # 03:17 cada día (fuera de las horas punta de Meta)
    buildCommand: pip install -r requirements.txt
    startCommand: python nocturno.py
    disk:
      name: datos            # el mismo disco que la web: ve las mismas cuentas
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: CLAVE_TOKENS
        fromService:         # comparte clave con la web, si no no podría descifrar
          type: web
          name: radar-creativos
          envVarKey: CLAVE_TOKENS
