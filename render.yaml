# Despliegue en Render.com — "New" → "Blueprint" → este repositorio → Apply.
# Un solo servicio: la web Y el agente 24/7 (el agente corre en segundo plano
# dentro del mismo servicio, porque en Render los discos no se comparten).
services:
  - type: web
    name: radar-creativos
    runtime: python
    plan: starter            # necesario para el disco y para que no se duerma
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    disk:
      name: datos
      mountPath: /data       # solo guarda los tokens CIFRADOS de quien active el 24/7
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: CLAVE_TOKENS    # clave con la que se cifran los tokens en reposo
        generateValue: true  # Render la genera sola; no la ve nadie
      - key: HORA_RONDA
        value: "3"           # hora (del servidor) a la que el agente hace su ronda
